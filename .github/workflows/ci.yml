# Prova externa de que um clone limpo reproduz a entrega.
#
# O modo de falha que este projeto ja sofreu foi o repositorio parecer completo
# na maquina de quem desenvolveu e quebrar para quem apenas clonava. O CI existe
# para que essa divergencia apareca em cada push, e nao na banca.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite em clone limpo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Os extremos da faixa declarada em requires-python.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Sincronizar dependencias travadas
        run: uv sync --frozen

      - name: Executar a suite
        run: uv run pytest -q

      - name: Validar a entrega consolidada
        run: uv run validate-deliverable

      - name: Validar o contrato LLM V2
        run: uv run validate-llm-contract-v2

  escalabilidade:
    name: Benchmark de escalabilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Sincronizar dependencias travadas
        run: uv sync --frozen

      # A medicao depende do hardware do runner, entao o benchmark roda para
      # provar que executa e permanece em escopo; os numeros do relatorio nao
      # sao comparados com os versionados.
      - name: Medir sob demanda variavel
        run: uv run run-load-benchmark

      - name: Validar escopo e ausencia de dado individual
        run: uv run validate-scalability

      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-escalabilidade
          path: artifacts/scalability/
          retention-days: 14

  painel:
    name: Painel estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Sincronizar dependencias travadas
        run: uv sync --frozen

      # A barreira de privacidade roda na construcao: se o HTML carregasse dado
      # individual, o comando falha em vez de escrever o arquivo.
      - name: Construir o painel
        run: uv run build-dashboard

      - uses: actions/upload-artifact@v4
        with:
          name: painel-estatico
          path: reports/dashboard/
          retention-days: 14

  implantacao:
    name: Container e infraestrutura como codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O driver padrao do docker nao exporta cache; o driver docker-container
      # do buildx exporta, e e o que torna o cache entre execucoes possivel.
      - name: Preparar o buildx
        uses: docker/setup-buildx-action@v3

      # A imagem e o modulo Terraform sao entregaveis: se nao construirem ou
      # nao validarem, sao texto, nao configuracao de implantacao.
      - name: Construir a imagem do servico
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fiap-techchallenge-fase2-inferencia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a integridade do modelo congelado dentro da imagem
        run: |
          docker run --rm --entrypoint uv \
            fiap-techchallenge-fase2-inferencia:ci \
            run python -c "from tech_challenge_fase2.serving import resolve_frozen_model; \
            print('modelo congelado conferido:', resolve_frozen_model().candidate_id)"

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Conferir formatacao do IaC
        run: terraform -chdir=deploy/terraform fmt -check -recursive -diff

      - name: Validar o modulo Terraform
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
