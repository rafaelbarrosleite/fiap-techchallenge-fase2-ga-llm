[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fiap-techchallenge-fase2-ga-llm"
version = "0.7.0"
description = "GA, avaliacao protegida, LLM segura e entrega academica reproduzivel para o Tech Challenge da FIAP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.2",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "matplotlib==3.10.5",
  "joblib==1.5.3",
]

[project.scripts]
# Fluxo oficial da entrega. A trilha historica da integracao com o provider
# real vive em `tech_challenge_fase2._historical` e continua executavel por
# modulo; ela saiu daqui para que a vitrine mostre o caminho demonstravel.
validate-deliverable = "tech_challenge_fase2.run_deliverable:validate_main"
run-final-evaluation = "tech_challenge_fase2.run_final_evaluation:run_main"
evaluate-llm-output = "tech_challenge_fase2.run_llm_evaluation:evaluate_main"
prepare-individual-explanation = "tech_challenge_fase2.run_individual_explanation:prepare_main"
run-individual-explanation = "tech_challenge_fase2.run_individual_explanation:run_main"
evaluate-individual-explanation = "tech_challenge_fase2.run_individual_explanation:evaluate_main"
validate-llm-contract-v2 = "tech_challenge_fase2.run_llm_contract_v2:validate_main"
run-load-benchmark = "tech_challenge_fase2.run_serving:benchmark_main"
validate-scalability = "tech_challenge_fase2.run_serving:validate_main"
build-dashboard = "tech_challenge_fase2.run_dashboard:build_main"
demo-barreiras = "tech_challenge_fase2.run_demo:barriers_main"

# Reproducao metodologica deliberada: caros, sobrescrevem estado congelado ou
# exigem credencial. Nao executar durante a demonstracao.
run-baseline = "tech_challenge_fase2.baseline:main"
run-ga-experiment = "tech_challenge_fase2.run_official:experiment_main"
run-ga-battery = "tech_challenge_fase2.run_official:battery_main"
run-ga-analysis = "tech_challenge_fase2.run_official:analysis_main"
build-final-deliverable = "tech_challenge_fase2.run_deliverable:build_main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tech_challenge_fase2"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
